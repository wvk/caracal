name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / rubyzip ${{ matrix.rubyzip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        rubyzip: ['~> 1.3', '~> 2.4', '~> 3.4']
    env:
      RUBYZIP_VERSION: ${{ matrix.rubyzip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  ooxml:
    name: Open XML SDK validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake ooxml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ooxml-documents
          path: tmp/ooxml
